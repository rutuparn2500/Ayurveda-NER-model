<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SattvaX+ - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f766e 100%);
            overflow: hidden;
        }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-pattern::before,
        .bg-pattern::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: float 8s ease-in-out infinite;
        }

        .bg-pattern::before {
            width: 400px; height: 400px;
            background: #10b981;
            top: -100px; right: -100px;
        }

        .bg-pattern::after {
            width: 300px; height: 300px;
            background: #3b82f6;
            bottom: -50px; left: -50px;
            animation-delay: 3s;
            animation-duration: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: cardAppear 0.6s ease-out both;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0f766e, #10b981);
            border-radius: 14px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .login-card h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .login-card .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            border-color: #94a3b8;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .google-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.25rem 0;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span { padding: 0 1rem; }

        .guest-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: #0f766e;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }

        .guest-btn:hover {
            background: #0d6b63;
            box-shadow: 0 4px 16px rgba(15, 118, 110, 0.3);
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="login-card">
        <div class="login-logo">S+</div>
        <h1>Welcome to SattvaX+</h1>
        <p class="subtitle">Ayurveda Clinical Intelligence Engine<br>Sign in to access the dashboard</p>

        <button class="google-btn" onclick="googleLogin()">
            <svg viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>

        <div class="divider"><span>or</span></div>

        <button class="guest-btn" onclick="guestLogin()">
            Continue as Guest
        </button>

        <div class="footer-text">
            By signing in, you agree to use this tool for educational and research purposes only.
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('sattvax_user')) {
            window.location.href = '/';
        }

        function googleLogin() {
            try {
                google.accounts.id.initialize({
                    client_id: '602745223518-dm6rgc4j15m248l7adocdujvfdhs977e.apps.googleusercontent.com',
                    callback: handleGoogleResponse,
                    ux_mode: 'popup'
                });
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        // Popup blocked or unavailable, use guest as fallback
                        guestLogin();
                    }
                });
            } catch(e) {
                // Google library not loaded, fallback to guest
                guestLogin();
            }
        }

        function handleGoogleResponse(response) {
            // Decode the JWT to get user info
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                const user = {
                    name: payload.name || payload.email,
                    email: payload.email,
                    picture: payload.picture || '',
                    method: 'google'
                };
                localStorage.setItem('sattvax_user', JSON.stringify(user));
                window.location.href = '/';
            } catch(e) {
                guestLogin();
            }
        }

        function guestLogin() {
            const user = {
                name: 'Guest User',
                email: 'guest@sattvax.app',
                picture: '',
                method: 'guest'
            };
            localStorage.setItem('sattvax_user', JSON.stringify(user));
            window.location.href = '/';
        }
    </script>
</body>
</html>
